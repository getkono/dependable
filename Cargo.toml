[workspace]
resolver = "3"
members = [
    "crates/dependable-core",
    "crates/dependable-fetch",
    "crates/dependable-tui",
    "crates/dependable-report",
    "crates/dependable",
]
# Test fixtures contain their own Cargo.toml/Cargo.lock and are parsed as data,
# never built — keep them out of the workspace.
exclude = ["crates/dependable/tests/fixtures"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkono/dependable"
authors = ["Justin Chung"]

# Shared dependency catalogue for the Rust/Crates.io MVP.
[workspace.dependencies]
# --- internal crates (published to crates.io together; version kept in lockstep
# with [workspace.package] by release-plz) ---
dependable-core = { version = "0.1.4", path = "crates/dependable-core" }
dependable-fetch = { version = "0.1.4", path = "crates/dependable-fetch" }
dependable-tui = { version = "0.1.4", path = "crates/dependable-tui" }
dependable-report = { version = "0.1.4", path = "crates/dependable-report" }
# --- dependable-core (pure) ---
toml_edit = "0.22"
roxmltree = "0.20"
regex = "1"
serde = { version = "1", features = ["derive"] }
semver = "1"
thiserror = "2"
# --- dependable-fetch / dependable (IO) ---
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
    "http2",
    "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
moka = { version = "0.12", features = ["future"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.17"
figment = { version = "0.10", features = ["toml", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
# --- dependable-tui (terminal UI; not pulled in by the libraries) ---
ratatui = "0.30"
globset = "0.4"
jiff = "0.2"
# --- dependable-report (V2 reports) ---
time = { version = "0.3", features = ["formatting"] }
# Default features only. `loader` is deliberately NOT enabled: it is the feature
# that would give templates filesystem access, and every template this workspace
# renders is either compiled in with `include_str!` or handed over in memory.
minijinja = "2"
# dev
wiremock = "0.6"
tempfile = "3"
