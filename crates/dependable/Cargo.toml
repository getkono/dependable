[package]
name = "dependable"
description = "CLI to check dependency versions and scan for known vulnerabilities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "dependable"

[features]
default = ["report"]
# The `report` subcommand. On by default so the workspace's clippy and test runs
# (which build default features only) keep compiling and exercising it.
report = ["dep:dependable-report"]

[[bin]]
name = "dependable"
path = "src/main.rs"

[dependencies]
# The `fix` command writes through a temporary file in the manifest's own directory
# and renames it into place, so an interrupted write cannot truncate a manifest.
tempfile.workspace = true
dependable-fetch.workspace = true
dependable-tui.workspace = true
dependable-report = { workspace = true, optional = true }
toml_edit.workspace = true
clap.workspace = true
globset.workspace = true
tokio.workspace = true
owo-colors.workspace = true
indicatif.workspace = true
figment.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
