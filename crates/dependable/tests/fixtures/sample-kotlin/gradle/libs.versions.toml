# A Gradle version catalog: the declarative half of a Gradle build.

[versions]
kotlin = "1.9.24"
okhttp = "4.12.0"
junit = { require = "5.10.2" }

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
guava = { group = "com.google.guava", name = "guava", version = "32.1.3-jre" }
commons-lang3 = "org.apache.commons:commons-lang3:3.14.0"
# Version supplied by a platform, not by this catalog.
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
testing = ["junit-jupiter"]
