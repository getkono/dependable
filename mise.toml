# mise configuration: dev tools + task runner.
#
# The Rust toolchain itself is owned by `rust-toolchain.toml` (rustup), which is
# the canonical source for the channel + components and is what CI honors. mise
# manages the auxiliary tools below and the task runner.

[tools]
hk = "latest"                            # git hooks manager (reads tool versions from mise)
"aqua:taiki-e/cargo-llvm-cov" = "latest" # coverage
"cargo:convco" = "latest"                # conventional-commit checker (commit-msg hook + PR CI)

[tasks.hooks]
description = "Install the hk git hooks (routed through mise)"
run = "hk install --mise"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

# Installs the `dependable` binary, which is both the CLI and the TUI — a bare
# `dependable` in a terminal opens the interactive UI. `--locked` so the install
# uses the versions in Cargo.lock rather than resolving fresh ones.
[tasks.install]
description = "Install the dependable CLI/TUI into ~/.cargo/bin"
run = "cargo install --path crates/dependable --locked --force"

[tasks.test]
description = "Run all tests (live network tests are #[ignore]d and skipped)"
run = "cargo test --workspace"

# The tree output is styled through `if_supports_color`, which consults the
# environment. The suite asserts on unstyled text, so a run with color forced on
# is the only thing that proves those assertions do not quietly depend on the
# terminal they happen to be run from. `FORCE_COLOR` outranks the TTY check in
# `supports-color`, which is what makes this a real second configuration rather
# than a repeat of the first.
#
# It `depends` on `test` so one `mise run test:color` runs both legs, plain first:
# CI's single test step and the `ci` task rely on that. Serializing also keeps the
# two runs from contending for one Cargo target directory and interleaving their
# output. `FORCE_COLOR` is in no fingerprint, so the second run rebuilds nothing
# and costs only its own test execution.
[tasks."test:color"]
description = "Run the test suite with terminal color forced on"
depends = ["test"]
run = "cargo test --workspace"
env = { FORCE_COLOR = "3" }

# `dependable`'s default features (`report`) are on in every other task, so this
# is the only thing that builds and tests the feature-off configuration. The
# `check` names the binary's own build as a failure separate from its tests.
#
# `wait_for` rather than `depends`: it must not run beside `test` or `test:color`,
# but running it alone should not drag them in. The CLI integration tests run the
# binary at `CARGO_BIN_EXE_dependable`, the shared `target/debug/dependable`, so a
# feature-off build running concurrently would replace it under the other suite.
[tasks."test:no-default-features"]
description = "Build and test the workspace with default features off"
wait_for = ["test", "test:color"]
run = [
  "cargo check --no-default-features -p dependable",
  "cargo test --workspace --no-default-features",
]

[tasks."test:live"]
description = "Run the live network smoke tests (hits crates.io + OSV)"
run = "cargo test --workspace -- --ignored"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint with clippy, treating warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-targets"

[tasks.coverage]
description = "Generate a coverage report (informational, no threshold)"
run = "cargo llvm-cov --workspace"

[tasks.commits]
description = "Check that commits on this branch follow Conventional Commits"
run = "convco check master..HEAD"

[tasks.ci]
description = "Run the full local CI gate: format check, lint, tests (both color modes), and the default-features-off build"
depends = ["fmt:check", "lint", "test", "test:color", "test:no-default-features"]
